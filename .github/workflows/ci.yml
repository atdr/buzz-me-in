name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded runs are cancelled on pull requests only. On main every commit
# keeps its own result, so a red one points at the commit that broke it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    uses: atdr/github-boilerplate/.github/workflows/node-ci.yml@v0.1.0
    with:
      # Each must exist in package.json; a missing one fails the job.
      scripts: lint format:check check typecheck test
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The one check branch protection requires from this workflow. The Node
  # matrix follows LTS, so requiring its jobs by name would break the ruleset
  # every time a line enters or leaves LTS.
  gate:
    name: ci gate
    # Not always(): a run superseded by a newer one is cancelled, and its gate
    # would report a failure on the same commit the newer run is checking.
    if: ${{ !cancelled() }}
    needs: [node]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              failure|cancelled) echo "::error::a required job finished as $result"; exit 1 ;;
            esac
          done
