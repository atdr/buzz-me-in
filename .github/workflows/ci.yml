name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Cancel superseded runs when a PR branch is force-pushed or updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commitlint:
    name: Commit messages (commitlint)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6

  quality:
    name: Quality gates (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Syntax check
        run: npm run check

      - name: Test
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

  # Separate from the quality gates: an audit result reflects the advisory
  # database at a point in time, not the diff under review. Kept out of the
  # matrix (the advisories are Node-independent) and out of the quality job,
  # where it used to run first and mask lint/test/typecheck on every failure.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Blocking: these are the only dependencies that reach the Pi.
      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev --package-lock-only

      # Advisory only: linters and commit tooling never ship, so a DoS in one
      # should not block unrelated PRs. Dependabot alerts remain the signal of
      # record for the dev tree; this step just surfaces them during review.
      - name: Audit all dependencies (advisory only)
        run: npm audit --audit-level=high --package-lock-only
        continue-on-error: true
