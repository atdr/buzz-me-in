name: publish-release

on:
  push:
    branches: [main]

# Scoped per job: the publish job must not hold a writable contents token.
permissions: {}

# Queued, never cancelled: a publish stopped halfway can leave a tag with no
# package behind it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: maintain the release PR
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Inline release-type until the repo needs a release-please-config.json
      # (extra-files, pre-1.0 bump rules, several packages).
      #
      # The release PR is opened with the default GITHUB_TOKEN, so its
      # pull_request runs are created but held for "Approve and run". Branch
      # protection requires them, so approve them before merging.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node

  # Gated on release-please's own output rather than a separate `on: release`
  # workflow: release-please runs with the default GITHUB_TOKEN, and GitHub
  # starts no workflow run from events that token creates, so a
  # release-triggered workflow would never fire and never report an error
  # either.
  #
  # In this file, not a reusable workflow: npm's trusted publisher names the
  # workflow file that publishes, and that has to be the caller's.
  publish:
    name: publish to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: npm-release # scopes the OIDC token so npm's trusted publisher can require it
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing; provenance is automatic
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          # trusted publishing needs npm >= 11.5.1, bundled with Node >= 24.5
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # npm tags whatever it publishes 'latest' unless --tag is passed; it
      # infers nothing from a prerelease suffix. A prerelease only reaches this
      # job from a deliberate Release-As footer, so publish it under its own
      # identifier (1.2.0-beta.1 -> beta) rather than moving latest.
      - name: Publish
        run: |
          version=$(node -p 'require("./package.json").version')
          case "$version" in
            *-*)
              tag=$(node -p 'process.argv[1].match(/-([a-z]+)/i)?.[1] ?? "next"' "$version")
              npm publish --tag "$tag"
              ;;
            *) npm publish ;;
          esac
