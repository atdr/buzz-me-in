name: publish-prerelease

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Prerelease version to publish, e.g. 1.2.0-beta.1'
        required: true
      dist_tag:
        description: "npm dist-tag to publish under (never 'latest')"
        required: true
        default: beta

permissions: {}

# Keyed by version: GitHub keeps one pending run per group and drops the
# older for a newer one, even with cancel-in-progress false, so a shared group
# would silently discard a second version dispatched while one is queued.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish-prerelease:
    name: publish prerelease to npm
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: npm-prerelease # scopes the OIDC token so npm's trusted publisher can require it
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing; provenance is automatic
    env:
      # Read through the environment rather than inlined into the run scripts,
      # so a dispatch input can never be interpreted as shell.
      VERSION: ${{ inputs.version }}
      DIST_TAG: ${{ inputs.dist_tag }}
    steps:
      - name: Refuse a stable version or the latest dist-tag
        run: |
          case "$VERSION" in
            *-*) ;;
            *) echo "::error::'$VERSION' is not a prerelease version (expected a suffix, e.g. 1.2.0-beta.1)"; exit 1 ;;
          esac
          if [ "$DIST_TAG" = latest ]; then
            echo "::error::refusing to move the latest dist-tag"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Runner-local bump, never committed: main keeps its released version and
      # the pending release-please PR keeps proposing a clean next version.
      - run: npm version "$VERSION" --no-git-tag-version
      - run: npm publish --tag "$DIST_TAG"

  tag-prerelease:
    # Records which commit a beta was built from, so a report against
    # 1.2.0-beta.4 can be compared with `git log prerelease/1.2.0-beta.4..main`.
    # After the publish, so the tag only marks a version that reached npm, and
    # in its own job so the publishing job's token stays read-only.
    name: tag the published commit
    needs: publish-prerelease
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the published commit
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        # A plain ref, never a GitHub Release: release-please reads the
        # Releases API to find the last release and does not filter out
        # prereleases, so a prerelease Release could become the base it bumps
        # from. The prerelease/ prefix keeps `git tag -l 'v*'` meaning released
        # versions.
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/prerelease/$VERSION" \
            -f "sha=$GITHUB_SHA" >/dev/null
          echo "tagged $GITHUB_SHA as prerelease/$VERSION"
