version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # `prefix` covers production dependencies, `prefix-development` the rest.
    # Production bumps ship to the Pi, so they land as `fix` and release-please
    # cuts a patch release with a changelog line — matching how production
    # advisories were fixed by hand (`35d0458`, `071e55a`). Dev-tooling bumps
    # stay `chore` and release-silent.
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps)
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      # Security updates are enabled in repo settings, not here. Scoped to
      # development so the prefix stays deterministic: dev advisories batch
      # into one release-silent `chore` PR, mirroring their advisory-only
      # status in the CI audit, while production advisories arrive as
      # individual `fix` PRs that block CI and cut a release.
      # `applies-to` defaults to version-updates, which is why the group
      # above needs no such key.
      security-updates:
        applies-to: security-updates
        dependency-type: development
        patterns:
          - '*'

  # Moving major tags (@v5) absorb minor/patch action updates automatically
  # but never cross majors; this surfaces new major versions as PRs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
